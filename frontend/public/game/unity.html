<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Ruin</title>
    <link rel="stylesheet" href="/game/TemplateData/style.css">
  </head>
  <body style="margin: 0; padding: 0;">
    <div class="webgl-content">
      <canvas id="gameContainer" width="1100" height="600" tabindex="-1"></canvas>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" id="fullscreen-btn"></div>
        <div class="title">Ruin</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#gameContainer");
      canvas.style.width = "1100px";
      canvas.style.height = "600px";

      var script = document.createElement("script");
      script.src = "/game/Build/ruin.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, {
          dataUrl: "/game/Build/ruin.data.br",
          frameworkUrl: "/game/Build/ruin.framework.js.br",
          codeUrl: "/game/Build/ruin.wasm.br",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "Ruin",
          productVersion: "1.0",
        }).then(function (unityInstance) {
          document.getElementById("fullscreen-btn").onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>

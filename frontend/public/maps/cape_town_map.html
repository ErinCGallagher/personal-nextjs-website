<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
    />

    <meta
      name="viewport"
      content="width=device-width,
                initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <style>
      #map_4ff4fa95e6c44c46335217dd22444bf6 {
        position: relative;
        width: 100%;
        height: 100%;
        left: 0%;
        top: 0%;
      }
      .leaflet-container {
        font-size: 1rem;
      }

      .numbered-marker {
        background-color: #dc2626;
        color: white;
        border-radius: 50%;
        text-align: center;
        font-weight: bold;
        font-size: 12px;
        line-height: 28px;
        width: 28px;
        height: 28px;
        border: 2px solid white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      }
    </style>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>

    <style>
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
      }
    </style>

    <script>
      L_NO_TOUCH = false;
      L_DISABLE_3D = false;
    </script>
  </head>
  <body>
    <div class="folium-map" id="map_4ff4fa95e6c44c46335217dd22444bf6"></div>
  </body>
  <script>
    function createNumberedIcon(number) {
      return L.divIcon({
        className: "numbered-marker",
        html: number.toString(),
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14],
      });
    }

    var map = L.map("map_4ff4fa95e6c44c46335217dd22444bf6", {
      center: [-33.9, 18.7],
      crs: L.CRS.EPSG3857,
      zoom: 9,
      zoomControl: true,
      preferCanvas: false,
    });

    var tile_layer = L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        minZoom: 0,
        maxZoom: 19,
        maxNativeZoom: 19,
        noWrap: false,
        attribution:
          '\u0026copy; \u003ca href="https://www.openstreetmap.org/copyright"\u003eOpenStreetMap\u003c/a\u003e contributors',
        subdomains: "abc",
        detectRetina: false,
        tms: false,
        opacity: 1,
      },
    );
    tile_layer.addTo(map);

    // Fetches a driving route from OSRM and draws it as a polyline.
    // waypoints: array of [lat, lon] pairs
    async function drawRoute(waypoints, color, popupText) {
      const coords = waypoints.map(([lat, lon]) => `${lon},${lat}`).join(";");
      const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;
      const response = await fetch(url);
      const data = await response.json();
      const latlngs = data.routes[0].geometry.coordinates.map(([lon, lat]) => [
        lat,
        lon,
      ]);
      const poly = L.polyline(latlngs, {
        color,
        opacity: 0.8,
        weight: 3,
        fill: false,
      }).addTo(map);
      poly.bindPopup(`<div>${popupText}</div>`);
    }

    // Day 2: Bo-Kaap, Boulders Beach, Cape of Good Hope, V&A Waterfront (blue)
    drawRoute(
      [
        [-33.9249, 18.4241],
        [-33.9264, 18.4088],
        [-34.1975, 18.4501],
        [-34.3567, 18.4975],
        [-33.9069, 18.4233],
      ],
      "#2563eb",
      "Day 2: Bo-Kaap, Boulders Beach, Cape of Good Hope &amp; V&amp;A Waterfront",
    );

    // Day 3: Chapman's Peak, Creation Winery, Hermanus (purple)
    drawRoute(
      [
        [-33.9249, 18.4241],
        [-34.09, 18.36],
        [-34.0392, 19.0114],
        [-34.4187, 19.2345],
      ],
      "#9333ea",
      "Day 3: Chapman's Peak, Creation Winery &amp; Hermanus",
    );

    // Day 4: Ashia Cheetah Sanctuary, Franschhoek (green)
    drawRoute(
      [
        [-34.4187, 19.2345],
        [-33.8, 18.95],
        [-33.9139, 19.1174],
        [-33.9249, 18.4241],
      ],
      "#16a34a",
      "Day 4: Ashia Cheetah Sanctuary &amp; Franschhoek",
    );

    // Day 5: West Coast Safari, Bloubergstrand, Table Mountain (red)
    drawRoute(
      [
        [-33.9249, 18.4241],
        [-33.2, 18.1],
        [-33.8167, 18.4333],
        [-33.9571, 18.4034],
      ],
      "#dc2626",
      "Day 5: West Coast Safari, Bloubergstrand &amp; Table Mountain",
    );

    // Day 6: Camps Bay, District Six Museum (orange)
    drawRoute(
      [
        [-33.9249, 18.4241],
        [-33.9508, 18.3762],
        [-33.9271, 18.4268],
      ],
      "#ea580c",
      "Day 6: Camps Bay &amp; District Six Museum",
    );

    // Legend
    var legend = L.control({ position: "topright" });
    legend.onAdd = function () {
      var div = L.DomUtil.create("div");
      div.style.cssText =
        "background: white; padding: 10px 14px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); font-size: 13px; line-height: 1.8;";
      div.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <strong>Itinerary</strong>
          <button id="legend-toggle" aria-label="Toggle legend" style="background:none; border:none; cursor:pointer; font-size:16px; line-height:1; padding:0;">▲</button>
        </div>
        <div id="legend-items" style="margin-top:4px;">
          <span style="display:inline-block;width:20px;height:3px;background:#6b7280;vertical-align:middle;margin-right:6px;border-radius:2px;"></span>Day 1: Arrival<br>
          <span style="display:inline-block;width:20px;height:3px;background:#2563eb;vertical-align:middle;margin-right:6px;border-radius:2px;"></span>Day 2: Cape Peninsula<br>
          <span style="display:inline-block;width:20px;height:3px;background:#9333ea;vertical-align:middle;margin-right:6px;border-radius:2px;"></span>Day 3: Hermanus<br>
          <span style="display:inline-block;width:20px;height:3px;background:#16a34a;vertical-align:middle;margin-right:6px;border-radius:2px;"></span>Day 4: Winelands<br>
          <span style="display:inline-block;width:20px;height:3px;background:#dc2626;vertical-align:middle;margin-right:6px;border-radius:2px;"></span>Day 5: West Coast<br>
          <span style="display:inline-block;width:20px;height:3px;background:#ea580c;vertical-align:middle;margin-right:6px;border-radius:2px;"></span>Day 6: Cape Town<br>
          <span style="display:inline-block;width:20px;height:3px;background:#6b7280;vertical-align:middle;margin-right:6px;border-radius:2px;"></span>Day 7: Departure
        </div>
      `;

      var toggle = div.querySelector("#legend-toggle");
      var items = div.querySelector("#legend-items");
      toggle.addEventListener("click", function () {
        var collapsed = items.style.display === "none";
        items.style.display = collapsed ? "block" : "none";
        toggle.textContent = collapsed ? "▲" : "▼";
      });

      L.DomEvent.disableClickPropagation(div);

      return div;
    };
    legend.addTo(map);

    // Marker 1: Cape Town City (Day 1)
    var marker_1 = L.marker([-33.9249, 18.4241], {
      icon: createNumberedIcon(1),
    }).addTo(map);
    marker_1.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 1: Cape Town City</b><br>Arrival & base for the week</div>`,
    );
    marker_1.bindTooltip(`<div>Day 1: Cape Town City</div>`, { sticky: true });

    // Marker 2: Bo-Kaap (Day 2)
    var marker_2 = L.marker([-33.9264, 18.4088], {
      icon: createNumberedIcon(2),
    }).addTo(map);
    marker_2.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 2: Bo-Kaap</b><br>Colourful houses & koeksisters</div>`,
    );
    marker_2.bindTooltip(`<div>Day 2: Bo-Kaap</div>`, { sticky: true });

    // Marker 3: Boulders Beach (Day 2)
    var marker_3 = L.marker([-34.1975, 18.4501], {
      icon: createNumberedIcon(3),
    }).addTo(map);
    marker_3.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 2: Boulders Beach</b><br>African penguins</div>`,
    );
    marker_3.bindTooltip(`<div>Day 2: Boulders Beach</div>`, { sticky: true });

    // Marker 4: Cape of Good Hope (Day 2)
    var marker_4 = L.marker([-34.3567, 18.4975], {
      icon: createNumberedIcon(4),
    }).addTo(map);
    marker_4.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 2: Cape of Good Hope</b><br>Dramatic cliffs</div>`,
    );
    marker_4.bindTooltip(`<div>Day 2: Cape of Good Hope</div>`, {
      sticky: true,
    });

    // Marker 5: V&A Waterfront (Day 2)
    var marker_5 = L.marker([-33.9069, 18.4233], {
      icon: createNumberedIcon(5),
    }).addTo(map);
    marker_5.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 2: V&amp;A Waterfront</b><br>Harbour dining</div>`,
    );
    marker_5.bindTooltip(`<div>Day 2: V&amp;A Waterfront</div>`, {
      sticky: true,
    });

    // Marker 6: Chapman's Peak Drive (Day 3)
    var marker_6 = L.marker([-34.09, 18.36], {
      icon: createNumberedIcon(6),
    }).addTo(map);
    marker_6.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 3: Chapman's Peak Drive</b><br>Scenic coastal road</div>`,
    );
    marker_6.bindTooltip(`<div>Day 3: Chapman's Peak Drive</div>`, {
      sticky: true,
    });

    // Marker 7: Creation Winery (Day 3)
    var marker_7 = L.marker([-34.0392, 19.0114], {
      icon: createNumberedIcon(7),
    }).addTo(map);
    marker_7.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 3: Creation Winery</b><br>Wine tasting</div>`,
    );
    marker_7.bindTooltip(`<div>Day 3: Creation Winery</div>`, { sticky: true });

    // Marker 8: Hermanus (Day 3)
    var marker_8 = L.marker([-34.4187, 19.2345], {
      icon: createNumberedIcon(8),
    }).addTo(map);
    marker_8.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 3: Hermanus</b><br>Whale watching</div>`,
    );
    marker_8.bindTooltip(`<div>Day 3: Hermanus</div>`, { sticky: true });

    // Marker 9: Ashia Cheetah Sanctuary (Day 4)
    var marker_9 = L.marker([-33.8, 18.95], {
      icon: createNumberedIcon(9),
    }).addTo(map);
    marker_9.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 4: Ashia Cheetah Sanctuary</b><br>Cheetah conservation</div>`,
    );
    marker_9.bindTooltip(`<div>Day 4: Ashia Cheetah Sanctuary</div>`, {
      sticky: true,
    });

    // Marker 10: Franschhoek (Day 4)
    var marker_10 = L.marker([-33.9139, 19.1174], {
      icon: createNumberedIcon(10),
    }).addTo(map);
    marker_10.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 4: Franschhoek</b><br>Wine tram</div>`,
    );
    marker_10.bindTooltip(`<div>Day 4: Franschhoek</div>`, { sticky: true });

    // Marker 11: West Coast Safari (Day 5)
    var marker_11 = L.marker([-33.2, 18.1], {
      icon: createNumberedIcon(11),
    }).addTo(map);
    marker_11.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 5: West Coast Safari</b><br>Game reserve & national park</div>`,
    );
    marker_11.bindTooltip(`<div>Day 5: West Coast Safari</div>`, {
      sticky: true,
    });

    // Marker 12: Bloubergstrand (Day 5)
    var marker_12 = L.marker([-33.8167, 18.4333], {
      icon: createNumberedIcon(12),
    }).addTo(map);
    marker_12.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 5: Bloubergstrand</b><br>Iconic Table Mountain view</div>`,
    );
    marker_12.bindTooltip(`<div>Day 5: Bloubergstrand</div>`, { sticky: true });

    // Marker 13: Table Mountain (Day 5)
    var marker_13 = L.marker([-33.9571, 18.4034], {
      icon: createNumberedIcon(13),
    }).addTo(map);
    marker_13.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 5: Table Mountain</b><br>Cableway to the summit</div>`,
    );
    marker_13.bindTooltip(`<div>Day 5: Table Mountain</div>`, { sticky: true });

    // Marker 14: Camps Bay (Day 6)
    var marker_14 = L.marker([-33.9508, 18.3762], {
      icon: createNumberedIcon(14),
    }).addTo(map);
    marker_14.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 6: Camps Bay</b><br>Beach & Atlantic views</div>`,
    );
    marker_14.bindTooltip(`<div>Day 6: Camps Bay</div>`, { sticky: true });

    // Marker 15: District Six Museum (Day 6)
    var marker_15 = L.marker([-33.9271, 18.4268], {
      icon: createNumberedIcon(15),
    }).addTo(map);
    marker_15.bindPopup(
      `<div style="width: 100.0%; height: 100.0%;"><b>Day 6: District Six Museum</b><br>Apartheid history</div>`,
    );
    marker_15.bindTooltip(`<div>Day 6: District Six Museum</div>`, {
      sticky: true,
    });
  </script>
</html>

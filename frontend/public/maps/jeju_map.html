<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
    />

    <meta
      name="viewport"
      content="width=device-width,
                initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <style>
      #map_jeju {
        position: relative;
        width: 100%;
        height: 100%;
        left: 0%;
        top: 0%;
      }
      .leaflet-container {
        font-size: 1rem;
      }

      .numbered-marker {
        background-color: #dc2626;
        color: white;
        border-radius: 50%;
        text-align: center;
        font-weight: bold;
        font-size: 12px;
        line-height: 28px;
        width: 28px;
        height: 28px;
        border: 2px solid white;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      }
    </style>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>

    <style>
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
      }
    </style>

    <script>
      L_NO_TOUCH = false;
      L_DISABLE_3D = false;
    </script>
  </head>
  <body>
    <div class="folium-map" id="map_jeju"></div>
  </body>
  <script>
    function createNumberedIcon(number) {
      return L.divIcon({
        className: "numbered-marker",
        html: number.toString(),
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14],
      });
    }

    var map = L.map("map_jeju", {
      center: [33.38, 126.55],
      crs: L.CRS.EPSG3857,
      zoom: 10,
      zoomControl: true,
      preferCanvas: false,
    });

    var tile_layer = L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        minZoom: 0,
        maxZoom: 19,
        maxNativeZoom: 19,
        noWrap: false,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        subdomains: "abc",
        detectRetina: false,
        tms: false,
        opacity: 1,
      },
    );
    tile_layer.addTo(map);

    // Fetches a driving route from OSRM and draws it as a polyline.
    // waypoints: array of [lat, lon] pairs
    async function drawRoute(waypoints, color, popupText) {
      const coords = waypoints.map(([lat, lon]) => `${lon},${lat}`).join(";");
      const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;
      const response = await fetch(url);
      const data = await response.json();
      const latlngs = data.routes[0].geometry.coordinates.map(([lon, lat]) => [
        lat,
        lon,
      ]);
      const poly = L.polyline(latlngs, {
        color,
        opacity: 0.8,
        weight: 3,
        fill: false,
      }).addTo(map);
      poly.bindPopup(`<div>${popupText}</div>`);
    }

    // Day 1: Airport → Dongmun Market → Dragon Head Rock → Samseonghyeol → Iho Beach (gray)
    drawRoute(
      [
        [33.5111, 126.4927],
        [33.5132, 126.5282],
        [33.5163, 126.5074],
        [33.5113, 126.5232],
        [33.5094, 126.4714],
      ],
      "#6b7280",
      "Day 1: Jeju City — Dongmun Market, Dragon Head Rock, Samseonghyeol &amp; Iho Beach",
    );

    // Day 2: Jeju City → Manjanggul → Seongeup → Seongsan → Hamdeok → Jeju City (blue)
    drawRoute(
      [
        [33.5132, 126.5282],
        [33.5283, 126.7712],
        [33.4177, 126.7921],
        [33.4588, 126.9407],
        [33.5437, 126.6624],
        [33.5132, 126.5282],
      ],
      "#2563eb",
      "Day 2: East Coast Loop — Manjanggul, Seongeup Folk Village, Seongsan Ilchulbong &amp; Hamdeok Beach",
    );

    // Day 3: Jeju City → Hyeopjae Beach → Jusangjeolli → Seogwipo (purple)
    drawRoute(
      [
        [33.5132, 126.5282],
        [33.3943, 126.2399],
        [33.2404, 126.4167],
        [33.2484, 126.5617],
      ],
      "#9333ea",
      "Day 3: West Coast &amp; South — Hyeopjae Beach, Jusangjeolli Cliffs, Jeongbang Waterfall &amp; Seogwipo",
    );

    // Day 4: Seogwipo → Cheonjiyeon → Jungmun Beach (green)
    drawRoute(
      [
        [33.2484, 126.5617],
        [33.2429, 126.5652],
        [33.2426, 126.5490],
        [33.2399, 126.4226],
      ],
      "#16a34a",
      "Day 4: Seogwipo — Jeongbang Waterfall, Cheonjiyeon Waterfall &amp; Jungmun Saekdal Beach",
    );

    // Legend
    var legend = L.control({ position: "topright" });
    legend.onAdd = function () {
      var div = L.DomUtil.create("div");
      div.style.cssText =
        "background: white; padding: 10px 14px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); font-size: 13px; line-height: 1.8;";
      div.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <strong>Itinerary</strong>
          <button id="legend-toggle" aria-label="Toggle legend" style="background:none; border:none; cursor:pointer; font-size:16px; line-height:1; padding:0;">▲</button>
        </div>
        <div id="legend-items" style="margin-top:4px;">
          <span style="display:inline-block;width:20px;height:3px;background:#6b7280;vertical-align:middle;margin-right:6px;border-radius:2px;"></span>Day 1: Jeju City<br>
          <span style="display:inline-block;width:20px;height:3px;background:#2563eb;vertical-align:middle;margin-right:6px;border-radius:2px;"></span>Day 2: East Coast Loop<br>
          <span style="display:inline-block;width:20px;height:3px;background:#9333ea;vertical-align:middle;margin-right:6px;border-radius:2px;"></span>Day 3: West Coast &amp; South<br>
          <span style="display:inline-block;width:20px;height:3px;background:#16a34a;vertical-align:middle;margin-right:6px;border-radius:2px;"></span>Day 4: Seogwipo<br>
        </div>
      `;

      var toggle = div.querySelector("#legend-toggle");
      var items = div.querySelector("#legend-items");
      toggle.addEventListener("click", function () {
        var collapsed = items.style.display === "none";
        items.style.display = collapsed ? "block" : "none";
        toggle.textContent = collapsed ? "▲" : "▼";
      });

      L.DomEvent.disableClickPropagation(div);

      return div;
    };
    legend.addTo(map);

    // Day 1 markers
    var marker_1 = L.marker([33.5111, 126.4927], {
      icon: createNumberedIcon(1),
    }).addTo(map);
    marker_1.bindPopup(
      `<div><b>1. Jeju International Airport</b><br>Arrival & car hire</div>`,
    );
    marker_1.bindTooltip(`<div>Jeju International Airport</div>`, { sticky: true });

    var marker_2 = L.marker([33.5132, 126.5282], {
      icon: createNumberedIcon(2),
    }).addTo(map);
    marker_2.bindPopup(
      `<div><b>2. Dongmun Traditional Market</b><br>Black pork, hallabong & haenyeo seafood</div>`,
    );
    marker_2.bindTooltip(`<div>Dongmun Traditional Market</div>`, { sticky: true });

    var marker_3 = L.marker([33.5163, 126.5074], {
      icon: createNumberedIcon(3),
    }).addTo(map);
    marker_3.bindPopup(
      `<div><b>3. Yonduam (Dragon Head Rock)</b><br>Basalt coastal formation</div>`,
    );
    marker_3.bindTooltip(`<div>Yonduam (Dragon Head Rock)</div>`, { sticky: true });

    var marker_4 = L.marker([33.5113, 126.5232], {
      icon: createNumberedIcon(4),
    }).addTo(map);
    marker_4.bindPopup(
      `<div><b>4. Samseonghyeol Shrine</b><br>Jeju's founding myth & oldest historic site</div>`,
    );
    marker_4.bindTooltip(`<div>Samseonghyeol Shrine</div>`, { sticky: true });

    var marker_5 = L.marker([33.5094, 126.4714], {
      icon: createNumberedIcon(5),
    }).addTo(map);
    marker_5.bindPopup(
      `<div><b>5. Iho Tewoo Beach</b><br>City beach with horse-shaped lighthouses</div>`,
    );
    marker_5.bindTooltip(`<div>Iho Tewoo Beach</div>`, { sticky: true });

    // Day 2 markers
    var marker_6 = L.marker([33.5283, 126.7712], {
      icon: createNumberedIcon(6),
    }).addTo(map);
    marker_6.bindPopup(
      `<div><b>6. Manjanggul Lava Tube</b><br>One of the world's longest lava tube systems</div>`,
    );
    marker_6.bindTooltip(`<div>Manjanggul Lava Tube</div>`, { sticky: true });

    var marker_7 = L.marker([33.4177, 126.7921], {
      icon: createNumberedIcon(7),
    }).addTo(map);
    marker_7.bindPopup(
      `<div><b>7. Seongeup Folk Village</b><br>Living village, 600+ years of traditional Jeju architecture</div>`,
    );
    marker_7.bindTooltip(`<div>Seongeup Folk Village</div>`, { sticky: true });

    var marker_8 = L.marker([33.4588, 126.9407], {
      icon: createNumberedIcon(8),
    }).addTo(map);
    marker_8.bindPopup(
      `<div><b>8. Seongsan Ilchulbong</b><br>Sunrise Peak — 182m tuff cone, UNESCO World Heritage</div>`,
    );
    marker_8.bindTooltip(`<div>Seongsan Ilchulbong (Sunrise Peak)</div>`, { sticky: true });

    var marker_9 = L.marker([33.5437, 126.6624], {
      icon: createNumberedIcon(9),
    }).addTo(map);
    marker_9.bindPopup(
      `<div><b>9. Hamdeok Beach</b><br>Turquoise water, fine white sand</div>`,
    );
    marker_9.bindTooltip(`<div>Hamdeok Beach</div>`, { sticky: true });

    // Day 3 markers
    var marker_10 = L.marker([33.3943, 126.2399], {
      icon: createNumberedIcon(10),
    }).addTo(map);
    marker_10.bindPopup(
      `<div><b>10. Hyeopjae Beach</b><br>Mint-green water, white sand, Biyangdo Island backdrop</div>`,
    );
    marker_10.bindTooltip(`<div>Hyeopjae Beach</div>`, { sticky: true });

    var marker_11 = L.marker([33.2404, 126.4167], {
      icon: createNumberedIcon(11),
    }).addTo(map);
    marker_11.bindPopup(
      `<div><b>11. Jusangjeolli Cliffs</b><br>Hexagonal basalt columns descending into the sea</div>`,
    );
    marker_11.bindTooltip(`<div>Jusangjeolli Cliffs</div>`, { sticky: true });

    var marker_12 = L.marker([33.2429, 126.5652], {
      icon: createNumberedIcon(12),
    }).addTo(map);
    marker_12.bindPopup(
      `<div><b>12. Jeongbang Waterfall</b><br>The only waterfall in Asia that falls directly into the ocean</div>`,
    );
    marker_12.bindTooltip(`<div>Jeongbang Waterfall</div>`, { sticky: true });

    var marker_13 = L.marker([33.2484, 126.5617], {
      icon: createNumberedIcon(13),
    }).addTo(map);
    marker_13.bindPopup(
      `<div><b>13. Seogwipo — Maeil Olle Market</b><br>Daily market, heart of the city</div>`,
    );
    marker_13.bindTooltip(`<div>Seogwipo Maeil Olle Market</div>`, { sticky: true });

    var marker_14 = L.marker([33.2469, 126.5534], {
      icon: createNumberedIcon(14),
    }).addTo(map);
    marker_14.bindPopup(
      `<div><b>14. Lee Jungseop Street &amp; Museum</b><br>Named after Korea's most beloved modern painter</div>`,
    );
    marker_14.bindTooltip(`<div>Lee Jungseop Street</div>`, { sticky: true });

    // Day 4 markers
    var marker_15 = L.marker([33.2426, 126.5490], {
      icon: createNumberedIcon(15),
    }).addTo(map);
    marker_15.bindPopup(
      `<div><b>15. Cheonjiyeon Waterfall</b><br>Sky Connected Lake — subtropical forest setting</div>`,
    );
    marker_15.bindTooltip(`<div>Cheonjiyeon Waterfall</div>`, { sticky: true });

    var marker_16 = L.marker([33.2399, 126.4226], {
      icon: createNumberedIcon(16),
    }).addTo(map);
    marker_16.bindPopup(
      `<div><b>16. Jungmun Saekdal Beach</b><br>Surf beach framed by black lava cliffs</div>`,
    );
    marker_16.bindTooltip(`<div>Jungmun Saekdal Beach</div>`, { sticky: true });
  </script>
</html>
